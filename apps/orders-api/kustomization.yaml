apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
# CI rewrites newTag after every successful build of the app repo.
# Each change here is a deploy commit that Argo CD applies and the agent can query.
images:
  - name: orders-api
    newName: ghcr.io/glichy-gem/orders-api
    newTag: sha-2d4f696
