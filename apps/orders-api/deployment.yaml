apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  labels:
    app: orders-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: orders-api
          # Placeholder name: kustomization.yaml maps it to the GHCR image and
          # the Git SHA tag that CI wrote.
          image: orders-api
          imagePullPolicy: IfNotPresent
          ports:
            # Named so a PodMonitor can scrape it even while the pod is NotReady.
            - name: http
              containerPort: 8000
          env:
            - name: ORDERS_REDIS_URL
              value: redis://redis:6379/0
          # Liveness: is the process alive? Never depends on Redis.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness: can it serve traffic? Fails while Redis is down.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
