apiVersion: v1
kind: Service
metadata:
  name: orders-api
  labels:
    app: orders-api
spec:
  type: NodePort
  selector:
    app: orders-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      # Mapped to localhost:8080 by infra/kind-config.yaml in the main repo.
      nodePort: 30080
