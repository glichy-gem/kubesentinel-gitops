apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesentinel-agent
  labels:
    app: kubesentinel-agent
spec:
  replicas: 1
  # One writer for the SQLite file: stop the old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kubesentinel-agent
  template:
    metadata:
      labels:
        app: kubesentinel-agent
    spec:
      # The collectors read the Kubernetes API as this account; see rbac.yaml.
      serviceAccountName: kubesentinel-agent
      securityContext:
        fsGroup: 10001
      containers:
        - name: agent
          # Placeholder name: kustomization.yaml maps it to the GHCR image and tag.
          image: kubesentinel-agent
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: KS_DB_PATH
              value: /data/kubesentinel.db
          # KS_GEMINI_API_KEY and the Telegram settings. The Secret is created from
          # .env by `make agent-secret` in the app repo and never stored in Git.
          # Optional: without it the agent diagnoses with the rule matcher only.
          envFrom:
            - secretRef:
                name: kubesentinel-agent-secrets
                optional: true
            # Eval mode (KS_DRY_RUN, a shorter quiet period), switched on and off by
            # `make eval-mode-on|off` in the app repo. Not in Git: it is a lab switch.
            - configMapRef:
                name: kubesentinel-agent-eval
                optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi # headroom for a git clone during a fix
          volumeMounts:
            - name: data
              mountPath: /data
            # GitOps write access: the deploy key from `make agent-git-key`.
            - name: git-key
              mountPath: /secrets/git
              readOnly: true
            # Scratch space for git clones; the root filesystem stays read-only.
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kubesentinel-agent-data
        - name: git-key
          secret:
            secretName: kubesentinel-agent-git
            # Optional: without it the agent still runs; Git-based fixes report the missing key.
            optional: true
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
