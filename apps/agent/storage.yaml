# Incidents, alerts and (later) evidence and actions survive agent restarts and
# redeploys. kind's default storage class keeps the file on the node's disk.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubesentinel-agent-data
  labels:
    app: kubesentinel-agent
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubesentinel-agent
  labels:
    app: kubesentinel-agent
