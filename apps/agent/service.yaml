# Cluster-internal only: Alertmanager posts to it. Use kubectl port-forward to browse it.
apiVersion: v1
kind: Service
metadata:
  name: kubesentinel-agent
  labels:
    app: kubesentinel-agent
spec:
  selector:
    app: kubesentinel-agent
  ports:
    - name: http
      port: 8000
      targetPort: 8000
